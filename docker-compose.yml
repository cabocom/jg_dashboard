services:
  # Base de datos PostgreSQL exclusiva para el Control Plane (jg_dashboard)
  jg_dashboard_postgres:
    image: postgres:16-alpine
    container_name: jg_dashboard_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-jg_dashboard}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: "${DB_PASSWORD:?Error: DB_PASSWORD es obligatoria. Defínala en su archivo .env}"
    volumes:
      - jg_dashboard_postgres_data:/var/lib/postgresql/data
    ports:
      # Puerto 5434 en host para evitar colisiones con jg_agente (5433) y locales (5432)
      - "${JG_DASHBOARD_DB_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${DB_DATABASE:-jg_dashboard}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - jg_dashboard_net

  # Panel Web de Control y Gobernanza HITL (Laravel 11 + Filament v3)
  jg_dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jg_dashboard
    restart: unless-stopped
    depends_on:
      jg_dashboard_postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      APP_NAME: ${APP_NAME:-jG Dashboard}
      APP_ENV: ${APP_ENV:-local}
      APP_KEY: "${APP_KEY:?Error: APP_KEY es obligatoria. Genere una con 'php artisan key:generate' y defínala en su archivo .env}"
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-http://localhost:8080}
      DB_CONNECTION: pgsql
      DB_HOST: jg_dashboard_postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-jg_dashboard}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: "${DB_PASSWORD:?Error: DB_PASSWORD es obligatoria. Defínala en su archivo .env}"
      JG_AGENTE_API_URL: ${JG_AGENTE_API_URL:-http://jg_agente:8000}
      JG_AGENTE_SECRET: ${JG_AGENTE_SECRET:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@javiergalvez.test.local}
      ADMIN_DEFAULT_PASSWORD: "${ADMIN_DEFAULT_PASSWORD:?Error: ADMIN_DEFAULT_PASSWORD es obligatoria. Defínala en su archivo .env}"
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
    volumes:
      - ./app:/var/www/html/app
      - ./bootstrap:/var/www/html/bootstrap
      - ./config:/var/www/html/config
      - ./database:/var/www/html/database
      - ./public:/var/www/html/public
      - ./resources:/var/www/html/resources
      - ./routes:/var/www/html/routes
    ports:
      - "${WEB_PORT:-8080}:8080"
    networks:
      - jg_dashboard_net
      - jg_network

networks:
  jg_dashboard_net:
    driver: bridge
  jg_network:
    name: jg_network
    external: true

volumes:
  jg_dashboard_postgres_data:
