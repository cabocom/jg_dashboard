stages:
  - test
  - build

# ==========================================
# STAGE: TEST
# ==========================================

test:pest:
  stage: test
  image: alpine:3.20
  cache:
    key: "php-composer-${CI_COMMIT_REF_SLUG}"
    paths:
      - vendor/
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
  before_script:
    - apk add --no-cache php83 php83-cli php83-phar php83-mbstring php83-openssl php83-intl php83-pdo php83-pdo_sqlite php83-tokenizer php83-dom php83-xml php83-xmlwriter php83-xmlreader php83-session php83-fileinfo php83-curl php83-simplexml php83-ctype php83-posix php83-zip php83-bcmath php83-pcntl composer
    - mkdir -p storage/framework/views storage/framework/cache/data storage/framework/sessions storage/logs bootstrap/cache
    - chmod -R 777 storage bootstrap/cache
    - cp .env.testing .env
    - composer install --no-interaction --prefer-dist
  script:
    - echo "🐘 Ejecutando suite de pruebas automatizadas Pest PHP..."
    - ./vendor/bin/pest

# ==========================================
# STAGE: BUILD (Publicación en registry de contenedores)
# ==========================================

build:docker:
  stage: build
  image: docker:24.0.7
  services:
    - name: docker:24.0.7-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG
  before_script:
    - USER_NAME="${REGISTRY_USER:-$CI_REGISTRY_USER}"
    - PASS_WORD="${REGISTRY_PASSWORD:-$CI_REGISTRY_PASSWORD}"
    - HOST_NAME="${REGISTRY_HOST:-$CI_REGISTRY}"
    - |
      if [ -z "$USER_NAME" ] || [ -z "$PASS_WORD" ]; then
        echo "❌ ERROR: Variables de autenticación del registro (REGISTRY_USER, REGISTRY_PASSWORD) no encontradas."
        exit 1
      fi
    - echo "🔑 Iniciando sesión en el registro $HOST_NAME con usuario $USER_NAME..."
    - echo "$PASS_WORD" | docker login "$HOST_NAME" -u "$USER_NAME" --password-stdin
  script:
    - HOST_NAME="${REGISTRY_HOST:-$CI_REGISTRY}"
    - IMAGE_BASE="$HOST_NAME/$CI_PROJECT_PATH"
    - BRANCH_NAME="${CI_COMMIT_BRANCH:-$CI_COMMIT_REF_SLUG}"
    - SAFE_TAG=$(echo "$BRANCH_NAME" | tr '/' '-')
    - IMAGE_TAG="$IMAGE_BASE:$SAFE_TAG"
    - echo "🛠️ Construyendo imagen Docker de jg_dashboard ($IMAGE_TAG)..."
    - docker build -t "$IMAGE_TAG" -f Dockerfile .
    - |
      if [ "$CI_COMMIT_BRANCH" == "main" ] || [ "$CI_COMMIT_BRANCH" == "$CI_DEFAULT_BRANCH" ]; then
        echo "🏷️ Etiquetando también como :latest para rama principal..."
        docker tag "$IMAGE_TAG" "$IMAGE_BASE:latest"
      fi
    - echo "🚀 Publicando imagen en $HOST_NAME..."
    - docker push "$IMAGE_TAG"
    - |
      if [ "$CI_COMMIT_BRANCH" == "main" ] || [ "$CI_COMMIT_BRANCH" == "$CI_DEFAULT_BRANCH" ]; then
        docker push "$IMAGE_BASE:latest"
      fi
      if [ -n "$CI_COMMIT_TAG" ]; then
        RELEASE_TAG="$IMAGE_BASE:$CI_COMMIT_TAG"
        echo "🏷️ Publicando tag de release: $RELEASE_TAG..."
        docker tag "$IMAGE_TAG" "$RELEASE_TAG"
        docker push "$RELEASE_TAG"
      fi
    - echo "✅ Imagen de jg_dashboard publicada con éxito en $HOST_NAME con tag $SAFE_TAG."
